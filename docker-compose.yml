services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    # Cambiamos el puerto externo al 3307 para evitar conflictos con MySQL nativo de Windows
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Se fijó la versión de MinIO (Corrección T01)
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: amazon/aws-cli
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://minio:9000 s3 mb s3://${MLFLOW_BUCKET_NAME} || true;
      exit 0;
      "

  mlflow:
    # Se usa el nuevo Dockerfile.mlflow para evitar pip install en cada arranque (Corrección T01)
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    restart: always
    ports:
      - "5000:5000"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_DNS_REBINDING_PROTECTION_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      mlflow server --backend-store-uri mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE} --default-artifact-root s3://${MLFLOW_BUCKET_NAME}/ --host 0.0.0.0 --port 5000
    # Se añade un healthcheck a mlflow para que el worker lo espere (Corrección T01)
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_PORT}:6379"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        # Sin .git en la imagen: el commit llega por aquí para la procedencia del run.
        # Uso: GIT_COMMIT=$(git rev-parse HEAD) docker compose build worker
        GIT_COMMIT: ${GIT_COMMIT:-no disponible}
    restart: always
    # Recortes, manifiesto y release_info.json de T03/T04 (versionados con DVC; hacer `dvc pull` antes).
    volumes:
      - ./data:/app/data:ro
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Credenciales de MinIO para el artifact store de MLflow (AWS_* = MinIO).
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      REDIS_HOST: redis
      ML_JOBS_QUEUE: ml_jobs
      # Bucket de modelos de T10 (AWS S3 real) con credenciales dedicadas.
      MODELS_S3_BUCKET: ${S3_BUCKET}
      MODELS_AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      MODELS_AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # MariaDB: training_jobs (estado y logs de cada job) y model_versions.
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    depends_on:
      redis:
        condition: service_started
      mlflow:
        # El worker ahora espera a que mlflow esté saludable (Corrección T01)
        condition: service_healthy

  # Servicio de inferencia de T10: reusa la imagen del worker y sirve POST /predict.
  inference:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    command: ["uvicorn", "serving.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODELS_S3_BUCKET: ${S3_BUCKET}
      MODELS_AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      MODELS_AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MODEL_CACHE_DIR: /tmp/model-cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Portal de anotación (Proyectos 1 y 2), ahora dentro de este mismo stack (P0-2).
  # Usa la MISMA MariaDB y el MISMO MinIO que MLflow, con su propia base de datos
  # (image_repo) y su propio bucket (image-annotations).
  # ---------------------------------------------------------------------------

  # Crea la base de datos del portal de anotación si no existe (corre una vez y termina).
  annotation-db-init:
    image: mariadb:10.11
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
    entrypoint: >
      /bin/sh -c "
      mariadb -h db -uroot -p$${MYSQL_ROOT_PASSWORD} -e \"CREATE DATABASE IF NOT EXISTS image_repo; GRANT ALL PRIVILEGES ON image_repo.* TO '$${MYSQL_USER}'@'%'; FLUSH PRIVILEGES;\"
      "

  # Backend del portal de anotación: imágenes, anotaciones, categorías, export COCO y
  # vistas de calidad. El portal (Next.js) le reenvía /api/p2/* (ver portal/next.config.mjs).
  annotation-api:
    build: ./annotation-backend
    restart: on-failure:5
    depends_on:
      annotation-db-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3100
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: image_repo
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: image-annotations
      MAX_UPLOAD_SIZE_BYTES: 5242880
      # Vistas de calidad: reportes del pipeline de calidad del Proyecto 2 y su política.
      QUALITY_ARTIFACTS_DIR: /artifacts
      QUALITY_CONFIG_PATH: /config/quality.yaml
      # Dataset Copilot (opcional). Sin clave responde en modo anclado.
      COPILOT_PROVIDER: ${COPILOT_PROVIDER:-none}
      COPILOT_API_KEY: ${COPILOT_API_KEY:-}
      COPILOT_MODEL: ${COPILOT_MODEL:-}
    volumes:
      - ${QUALITY_REPORTS_DIR:-./annotation-backend/quality/reports}:/artifacts:ro
      - ${QUALITY_CONFIG_FILE:-./annotation-backend/quality/quality.yaml}:/config/quality.yaml
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  db_data:
  minio_data: