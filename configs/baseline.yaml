# Línea base del clasificador (T05). Punto de partida para las 10 corridas de T07.
# Rutas relativas al directorio desde el que se ejecuta `python -m trainer`.

manifest_path: data/splits/manifest.csv   # T04: split 70/20/10, semilla 42, sin fuga
classes_path: data/crops/classes.json     # T03: {"0": "person", "1": "car"}
data_root: data/crops                     # crop_path es relativo a esta carpeta
output_dir: runs/baseline

# Los 7 hiperparámetros
optimizer: adamw
batch_size: 32
max_epochs: 30
lr: 0.001
img_size: 224
hidden_layers: [256]
dropout: 0.3

# Semillas separadas
shuffle_seed: 42
aug_seed: 43
init_seed: 44

# Early stopping (métrica de selección acordada: menor val_loss)
monitor: val_loss
patience: 5
min_delta: 0.001

# Backbone: ResNet18 con pesos ImageNet (torchvision IMAGENET1K_V1)
pretrained: true
trainable_backbone: layer4
