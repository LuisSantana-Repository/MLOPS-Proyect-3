[project]
name = "proyecto3-trainer"
version = "0.1.0"
description = "Entrenador del clasificador de recortes COCO (Proyecto 3 MLOps, ITESO)"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
