services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    # Cambiamos el puerto externo al 3307 para evitar conflictos con MySQL nativo de Windows
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Se fijó la versión de MinIO (Corrección T01)
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: amazon/aws-cli
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    # Artefactos de las corridas versionadas (mlflow-store/artifacts, `dvc pull mlflow-store.dvc`).
    # Se cargan en el bucket `mlflow` de MinIO para que las URIs originales (s3://mlflow/1/<run>/artifacts)
    # sigan resolviendo sin reescribir nada. `sync` solo agrega: no borra runs nuevos del bucket.
    volumes:
      - ./mlflow-store/artifacts:/mlflow-artifacts:ro
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://minio:9000 s3 mb s3://${MLFLOW_BUCKET_NAME} || true;
      aws --endpoint-url http://minio:9000 s3 mb s3://mlflow || true;
      if [ -d /mlflow-artifacts/1 ]; then
        aws --endpoint-url http://minio:9000 s3 sync /mlflow-artifacts s3://mlflow --only-show-errors || exit 1;
        echo 'artefactos de mlflow-store cargados en s3://mlflow';
      else
        echo 'AVISO: mlflow-store/artifacts está vacío; ejecuta dvc pull mlflow-store.dvc';
      fi;
      exit 0;
      "

  mlflow:
    # Se usa el nuevo Dockerfile.mlflow para evitar pip install en cada arranque (Corrección T01)
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    restart: always
    ports:
      - "5000:5000"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_DNS_REBINDING_PROTECTION_ENABLED: "false"
    depends_on:
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    # Backend store compartido (P0-1): SQLite versionado con DVC en el remoto S3 del proyecto,
    # con las 10 corridas originales de T07 y el Model Registry. `dvc pull mlflow-store.dvc` antes
    # de levantar. Los runs nuevos se agregan a este mismo archivo; para compartirlos:
    # scripts/mlflow_share.sh (dvc add + dvc push + commit de mlflow-store.dvc).
    volumes:
      - ./mlflow-store:/mlflow-store
    command: >
      sh -c "
      test -f /mlflow-store/mlflow.db || { echo 'falta mlflow-store/mlflow.db: ejecuta dvc pull mlflow-store.dvc'; exit 1; };
      exec mlflow server --backend-store-uri sqlite:////mlflow-store/mlflow.db --default-artifact-root s3://${MLFLOW_BUCKET_NAME}/ --host 0.0.0.0 --port 5000
      "
    # Se añade un healthcheck a mlflow para que el worker lo espere (Corrección T01)
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_PORT}:6379"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        # Sin .git en la imagen: el commit llega por aquí para la procedencia del run.
        # Uso: GIT_COMMIT=$(git rev-parse HEAD) docker compose build worker
        GIT_COMMIT: ${GIT_COMMIT:-no disponible}
    restart: always
    # Recortes, manifiesto y release_info.json de T03/T04 (versionados con DVC; hacer `dvc pull` antes).
    volumes:
      - ./data:/app/data:ro
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Credenciales de MinIO para el artifact store de MLflow (AWS_* = MinIO).
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      REDIS_HOST: redis
      ML_JOBS_QUEUE: ml_jobs
      # Bucket de modelos de T10 (AWS S3 real) con credenciales dedicadas.
      MODELS_S3_BUCKET: ${S3_BUCKET}
      MODELS_AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      MODELS_AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # MariaDB: training_jobs (estado y logs de cada job) y model_versions.
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    depends_on:
      redis:
        condition: service_started
      mlflow:
        # El worker ahora espera a que mlflow esté saludable (Corrección T01)
        condition: service_healthy

  # Servicio de inferencia de T10: reusa la imagen del worker y sirve POST /predict.
  inference:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    command: ["uvicorn", "serving.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODELS_S3_BUCKET: ${S3_BUCKET}
      MODELS_AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      MODELS_AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MODEL_CACHE_DIR: /tmp/model-cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy

volumes:
  db_data:
  minio_data: